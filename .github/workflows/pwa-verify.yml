name: PWA deploy verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Deep check live site build
        run: |
          B="https://evchargersnearme.pages.dev"
          CB=$(date +%s)
          echo "=== homepage markers ==="
          H=$(curl -s --max-time 30 "$B/?cb=$CB")
          echo "hp_theme_link=$(echo "$H" | grep -c 'theme.css')"
          echo "hp_block_header=$(echo "$H" | grep -c 'BLOCK:HEADER')"
          echo "hp_old_green=$(echo "$H" | grep -c '#16a34a')"
          echo "hp_head_title=$(echo "$H" | grep -o '<title>[^<]*</title>' | head -1)"
          echo "=== asset content sniff ==="
          TC=$(curl -s --max-time 30 "$B/theme.css?cb=$CB" | head -c 60)
          echo "theme_css_first60: $TC"
          SW=$(curl -s --max-time 30 "$B/sw.js?cb=$CB" | head -c 60)
          echo "sw_first60: $SW"
          echo "=== 404 behaviour ==="
          echo "nonexistent_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/zzz-not-a-file-12345?cb=$CB")"
          echo "nonexistent_body404=$(curl -s --max-time 30 "$B/zzz-not-a-file-12345?cb=$CB" | head -c 60)"
          echo "=== verdict ==="
          if [ "$(echo "$H" | grep -c 'theme.css')" -ge 1 ] && [ "$(echo "$H" | grep -c 'BLOCK:HEADER')" -ge 1 ]; then
            echo "NEW BUILD LIVE"
          else
            echo "OLD BUILD STILL SERVING on /"
          fi
