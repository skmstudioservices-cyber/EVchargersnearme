name: PWA deploy verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Deep check live site build
        run: |
          B="https://evchargersnearme.pages.dev"
          CB=$(date +%s)
          echo "=== homepage ==="
          H=$(curl -s --max-time 30 "$B/?cb=$CB")
          echo "hp_theme_link=$(echo "$H" | grep -c 'theme.css')"
          echo "hp_block_header=$(echo "$H" | grep -c 'BLOCK:HEADER')"
          echo "hp_old_green=$(echo "$H" | grep -c '#16a34a')"
          echo "hp_mapapp=$(echo "$H" | grep -c 'mapapp.js')"
          echo "hp_site_js=$(echo "$H" | grep -c 'site.js')"
          echo "=== bengaluru page ==="
          BG=$(curl -s --max-time 30 "$B/bengaluru/?cb=$CB")
          echo "bg_block_header=$(echo "$BG" | grep -c 'BLOCK:HEADER')"
          echo "bg_mapapp=$(echo "$BG" | grep -c 'mapapp.js')"
          echo "bg_startcity=$(echo "$BG" | grep -c 'startCity')"
          echo "bg_title=$(echo "$BG" | grep -o '<title>[^<]*</title>' | head -1)"
          echo "=== live data files ==="
          echo "data_bengaluru_first80: $(curl -s --max-time 30 "$B/data/bengaluru.json?cb=$CB" | head -c 80)"
          echo "data_bengaluru_size: $(curl -s --max-time 30 "$B/data/bengaluru.json?cb=$CB" | wc -c)"
          echo "data_delhi_size: $(curl -s --max-time 30 "$B/data/delhi.json?cb=$CB" | wc -c)"
          echo "=== live js files ==="
          echo "mapapp_first60: $(curl -s --max-time 30 "$B/mapapp.js?cb=$CB" | head -c 60)"
          echo "sitejs_first60: $(curl -s --max-time 30 "$B/site.js?cb=$CB" | head -c 60)"
          echo "themecss_first40: $(curl -s --max-time 30 "$B/theme.css?cb=$CB" | head -c 40)"
