name: PWA deploy verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live site build
        run: |
          B="https://evchargersnearme.pages.dev"
          CB=$(date +%s)
          H=$(curl -s --max-time 30 "$B/?cb=$CB")
          echo "homepage_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/?cb=$CB")"
          echo "theme_css_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/theme.css?cb=$CB")"
          echo "manifest_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/manifest.webmanifest?cb=$CB")"
          echo "sw_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/sw.js?cb=$CB")"
          echo "pwa_js_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/pwa.js?cb=$CB")"
          echo "icon_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/icons/icon-192.png?cb=$CB")"
          echo "blocksmd_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/BLOCKS.md?cb=$CB")"
          echo "positive_markers=$(echo "$H" | grep -c 'BLOCK:HEADER')"
          echo "theme_link=$(echo "$H" | grep -c 'theme.css')"
          echo "manifest_link=$(echo "$H" | grep -c 'manifest.webmanifest')"
          echo "themebtn_expected=0_initially_themejs_builds_it"
          echo "old_green_16a34a=$(echo "$H" | grep -c '#16a34a')"
          echo "data_theme_attr=$(echo "$H" | grep -c 'data-theme')"
          if [ "$(echo "$H" | grep -c 'theme.css')" -lt 1 ]; then echo "FAIL: live HTML does not reference theme.css (old build still serving?)"; exit 1; fi
          if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/theme.css?cb=$CB")" != "200" ]; then echo "FAIL: theme.css not 200"; exit 1; fi
          echo "VERIFY PASS: new build is live"
