name: Browser verify
on:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install playwright
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: ui checks
        run: |
          cat > check.mjs <<'JSEOF'
          import { chromium } from 'playwright';
          const B = 'https://evchargersnearme.pages.dev';
          const CB = Date.now();
          const browser = await chromium.launch();
          const ctx = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const page = await ctx.newPage();
          const errs = [];
          page.on('pageerror', e => errs.push('PAGEERROR ' + String(e).slice(0, 140)));
          await page.goto(B + '/?cb=' + CB, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
          await page.waitForTimeout(6000);
          const tile0 = await page.evaluate(() => { const t = document.querySelector('img.leaflet-tile'); return t ? t.src : 'none'; });
          await page.click('#cbMapTheme'); await page.waitForTimeout(2500);
          const tile1 = await page.evaluate(() => { const t = document.querySelector('img.leaflet-tile'); return t ? t.src : 'none'; });
          await page.click('#cbMapTheme'); await page.waitForTimeout(2500);
          const tile2 = await page.evaluate(() => { const t = document.querySelector('img.leaflet-tile'); return t ? t.src : 'none'; });
          const cornerLabels = await page.locator('#cornerCluster .cb-lb').allTextContents();
          const cornerOpen = await page.locator('#cornerCluster.open').count();
          const chipsVisible = await page.locator('#chipsBlock .cb-chip').count();
          const chipsHidden = await page.locator('#chipsBlock.cb-closed').count();
          const tabLabels = await page.locator('#pwaTabs .pt-lb').allTextContents();
          const addBtn = await page.locator('#pwaTabs .pwadd').count();
          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
          await page.screenshot({ path: 'shot-ui.png' });
          console.log('tile_default:' + tile0.slice(0, 55));
          console.log('tile_after_click1:' + tile1.slice(0, 55));
          console.log('tile_after_click2:' + tile2.slice(0, 55));
          console.log('corner_open:' + cornerOpen + ' | corner_labels:' + JSON.stringify(cornerLabels));
          console.log('chips_visible:' + chipsVisible + ' | chips_collapsed:' + chipsHidden);
          console.log('tabs:' + JSON.stringify(tabLabels) + ' | centre_add:' + addBtn);
          console.log('hOverflowPx:' + overflow + ' | errors:' + JSON.stringify(errs.slice(0, 3)));
          await browser.close();
          JSEOF
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shot-*.png
