name: Browser verify
on:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install playwright
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: dark + light checks
        run: |
          cat > check.mjs <<'JSEOF'
          import { chromium } from 'playwright';
          const B = 'https://evchargersnearme.pages.dev';
          const CB = Date.now();
          const browser = await chromium.launch();
          async function probe(name, colorScheme, extra) {
            const ctx = await browser.newContext({ viewport: { width: 390, height: 844 }, colorScheme });
            const page = await ctx.newPage();
            const errs = [];
            page.on('pageerror', e => errs.push('PAGEERROR ' + String(e).slice(0, 150)));
            await page.goto(B + '/?cb=' + CB, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => errs.push('GOTO'));
            await page.waitForTimeout(5000);
            if (extra) { await extra(page); await page.waitForTimeout(2500); }
            const theme = await page.evaluate(() => document.documentElement.getAttribute('data-theme'));
            const tileSrc = await page.evaluate(() => { const t = document.querySelector('img.leaflet-tile'); return t ? t.src : null; });
            const pins = await page.locator('.leaflet-marker-icon, .marker-cluster').count();
            const bodyBg = await page.evaluate(() => getComputedStyle(document.body).backgroundColor);
            await page.screenshot({ path: 'shot-' + name + '.png' });
            console.log('--- ' + name + ' ---');
            console.log('data-theme:' + theme + ' | bodyBg:' + bodyBg + ' | pins:' + pins);
            console.log('tileSrc:' + (tileSrc ? tileSrc.slice(0, 70) : 'none'));
            console.log('errors:' + JSON.stringify(errs.slice(0, 3)));
            await ctx.close();
          }
          await probe('light', 'light');
          await probe('dark', 'dark');
          await probe('dark-manual-tiles', 'light', async (p) => { await p.click('#cbMapTheme'); });
          await browser.close();
          JSEOF
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shot-*.png
