name: Browser verify
on:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install playwright
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: browser checks
        run: |
          cat > check.mjs <<'JSEOF'
          import { chromium } from 'playwright';
          const B = 'https://evchargersnearme.pages.dev';
          const CB = Date.now();
          const targets = [
            ['home', B + '/?cb=' + CB],
            ['bengaluru', B + '/bengaluru/?cb=' + CB],
            ['kw', B + '/how-to-find-ev-charging-stations/?cb=' + CB],
            ['privacy', B + '/privacy/?cb=' + CB]
          ];
          const browser = await chromium.launch();
          const ctx = await browser.newContext({ viewport: { width: 390, height: 844 } });
          for (const [name, url] of targets) {
            const page = await ctx.newPage();
            const errs = [];
            page.on('console', m => { if (m.type() === 'error') errs.push(m.text().slice(0, 140)); });
            page.on('pageerror', e => errs.push('PAGEERROR ' + String(e).slice(0, 160)));
            try { await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 }); } catch (e) { errs.push('GOTO ' + e.message.slice(0, 90)); }
            await page.waitForTimeout(6000);
            const pins = await page.locator('.leaflet-marker-icon, .marker-cluster, .leaflet-interactive').count();
            let countTxt = null;
            try { countTxt = await page.locator('#count, #kwcount').first().textContent({ timeout: 3000 }); } catch (e) {}
            const chips = await page.locator('#chipsBlock .cb-chip').count();
            const filters = await page.locator('#filters .fbtn').count();
            const corner = await page.locator('#cornerCluster .cbtn').count();
            const tabs = await page.locator('#pwaTabs .pwtab').count();
            const addbtnHidden = await page.locator('#addbtn').isVisible().catch(() => null);
            const tiles = await page.locator('img.leaflet-tile').count();
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            await page.screenshot({ path: 'shot-' + name + '.png', fullPage: false });
            console.log('--- ' + name + ' ---');
            console.log('pins:' + pins + ' | count:' + countTxt);
            console.log('chips:' + chips + ' | filters:' + filters + ' | corner:' + corner + ' | tabs:' + tabs + ' | addbtnVisible:' + addbtnHidden + ' | tiles:' + tiles);
            console.log('hOverflowPx:' + overflow + ' | errors:' + JSON.stringify(errs.slice(0, 5)));
            await page.close();
          }
          await browser.close();
          JSEOF
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shot-*.png
