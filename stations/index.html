<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV charging stations in India — full list by city</title>
<meta name="description" content="Browse 293 public EV charging stations across India — operator, connector types, power, price and one-tap directions.">
<link rel="canonical" href="https://myevchargersnearme.pages.dev/stations/">
<meta name="robots" content="index,follow">
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e7ebf0;--card:#fff;--bg:#f7f8fa;--ac:#10B981;--acd:#0e9f6e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:auto;padding:20px}
header.top{background:#0f172a;color:#e6ebf3;padding:16px 20px}.top a{color:#cbd5e1}.top b{color:#fff}
h1{font-size:26px;letter-spacing:-.02em;margin:14px 0 4px}.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.controls input,.controls select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.card:hover{box-shadow:0 6px 20px rgba(15,23,42,.08);transform:translateY(-1px)}
.card h2{font-size:15px;margin:0;line-height:1.3}
.meta{font-size:12.5px;color:var(--mut)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#ecfdf5;color:#065f46;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
.tag.g{background:#f1f5f9;color:#334155}
.row{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.btn{flex:1;text-align:center;border-radius:9px;padding:9px 10px;font-size:12.5px;font-weight:600;border:1px solid var(--line)}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.p:hover{background:var(--acd)}
.btn.s{background:#fff}
.count{color:var(--mut);font-size:13px;margin-bottom:8px}
@media(max-width:520px){.wrap{padding:14px}.controls input,.controls select{min-width:0;width:100%}}
</style>
</head>
<body>
<header class="top"><a href="/">← myevchargersnearme</a> <b>· Full station list</b></header>
<div class="wrap">
  <h1>EV charging stations in India</h1>
  <p class="sub">Public charging stations with operator, connector types, power and one-tap directions. Data: OpenStreetMap + PIB state totals.</p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search operator, city, address…" aria-label="Search stations">
    <select id="state" aria-label="Filter by state"><option value="">All states</option></select>
  </div>
  <div class="count" id="count">Loading…</div>
  <div class="grid" id="grid"></div>
</div>
<script>
const slug = (s) => (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let ALL = [];
function card(s){
  const city = slug(s.city), dir = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;
  const tags = [];
  if (s.connectors) tags.push(`<span class="tag">${s.connectors}</span>`);
  if (s.power_kw) tags.push(`<span class="tag g">${s.power_kw} kW</span>`);
  if (s.access) tags.push(`<span class="tag g">${s.access}</span>`);
  return `<article class="card">
    <h2><a href="/${city}/">${s.name}</a></h2>
    <div class="meta">${[s.operator, [s.city,s.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ')}</div>
    ${s.address?`<div class="meta">${s.address}</div>`:''}
    <div class="tags">${tags.join('')}</div>
    <div class="row">
      <a class="btn s" href="/${city}/">City guide</a>
      <a class="btn p" href="${dir}" target="_blank" rel="noopener">Directions →</a>
    </div>
  </article>`;
}
function render(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const st = document.getElementById('state').value;
  const list = ALL.filter(s => (!st || s.state===st) && (!q || `${s.name} ${s.operator} ${s.city} ${s.address}`.toLowerCase().includes(q)));
  document.getElementById('count').textContent = `${list.length} of ${ALL.length} stations`;
  document.getElementById('grid').innerHTML = list.map(card).join('');
}
fetch('/data/stations.json').then(r=>r.json()).then(d=>{
  ALL = (d.stations||[]).sort((a,b)=>(a.state||'').localeCompare(b.state||'')||(a.city||'').localeCompare(b.city||''));
  const states=[...new Set(ALL.map(s=>s.state).filter(Boolean))].sort();
  document.getElementById('state').innerHTML = '<option value="">All states</option>'+states.map(s=>`<option>${s}</option>`).join('');
  render();
}).catch(()=>{document.getElementById('count').textContent='Could not load station data.';});
document.getElementById('q').addEventListener('input',render);
document.getElementById('state').addEventListener('change',render);
</script>
</body>
</html>
